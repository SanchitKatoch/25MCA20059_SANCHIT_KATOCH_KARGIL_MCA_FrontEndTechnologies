<!DOCTYPE html>
<html lang="en">
<head>
    <title>Smart TO-DO Manager</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" 
     integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <h2 style="text-align: center;">Smart TO-DO Manager</h2><hr>

    <div class="row mt-3">
        <div class="col-md-4">
            <input id="task" class="form-control" placeholder="Enter task">
        </div>

     <div class="col-md-2">
          <select id="priority" class="form-select">
             <option>Low</option>
             <option>Medium</option>
             <option>High</option>
         </select>
     </div>

     <div class="col-md-3">
          <input type="date" id="date" class="form-control">
     </div>

     <div class="col-md-3">
      <button class="btn btn-primary w-100" onclick="add()">Add</button>
     </div>
    </div>

    <div class="mt-3 text-center">
        <button onclick="filterTask('all')" class="btn btn-outline-primary">All</button>
        <button onclick="filterTask('done')" class="btn btn-outline-success">Completed</button>
        <button onclick="filterTask('pending')" class="btn btn-outline-danger">Pending</button>
    </div>

    <div class="mt-3 text-center">
        <button onclick="sortP()" class="btn btn-secondary">Sort By Priority</button>
        <button onclick="sortD()" class="btn btn-secondary">Sort By Date</button>
    </div>

    <div class="mt-3 text-center">
        Total:0 <span id="t"></span> |
        Done:0 <span id="d"></span> |
        Pending:0 <span id="p"></span>
    </div>

    <div id="list" class="mt-4"></div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
    </script>
    <script src="script.js"></script>
</body>
</html>
